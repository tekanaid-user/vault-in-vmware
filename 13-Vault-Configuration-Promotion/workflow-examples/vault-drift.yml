name: Daily Vault inventory and rotation
on:
  schedule:
    - cron: '0 11 * * *' # UTC; confirm the desired local schedule
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vault-drift
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.VAULT_AUTOMATION_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, uat, prod]
    runs-on: [self-hosted, vault-demo]
    environment: ${{ matrix.environment }}-drift
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Collect structure using a read-only OIDC role
        env:
          TARGET_ENV: ${{ matrix.environment }}
        run: |
          umask 077
          python3 13-Vault-Configuration-Promotion/scripts/drift.py --env "$TARGET_ENV" > "$TARGET_ENV.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-drift-${{ matrix.environment }}
          path: ${{ matrix.environment }}.json
          retention-days: 7
  report:
    needs: collect
    if: always() && github.ref == 'refs/heads/main' && vars.VAULT_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true # Still produce an incomplete report if all collectors fail
        with:
          pattern: vault-drift-*
          path: reports
          merge-multiple: true
      - name: Compare available reports (missing reports remain visible)
        shell: bash
        run: |
          shopt -s nullglob
          report_files=(reports/*.json)
          python3 13-Vault-Configuration-Promotion/scripts/drift.py --compare "${report_files[@]}" > comparison.json
          echo 'Review comparison.json; this job never changes Vault.' >> "$GITHUB_STEP_SUMMARY"
      - name: Extract rotation ages without another Vault connection
        run: python3 13-Vault-Configuration-Promotion/scripts/rotation-report.py comparison.json > rotation-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-drift-comparison
          path: |
            comparison.json
            rotation-report.json
          retention-days: 7
      - name: Flag findings after saving the report
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          report = json.load(open('comparison.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"\nComplete: {report['complete']}; findings: {report['has_findings']}\n")
              output.write(f"Inventory differences: {len(report['inventory_differences'])}\n")
              for env in report['environments']:
                  inv = env['inventory']
                  output.write(f"- {env['environment']}: {len(inv['policies'])} policies, {len(inv['auth_methods'])} auth mounts, {len(inv['secrets_engines'])} engines, {len(inv['kv_paths'])} KV paths; {len(env['findings'])} findings; {len(inv['coverage']['unsupported_details'])} detail exclusions\n")
              rotation = json.load(open('rotation-report.json'))
              output.write(f"Rotation ages: {rotation['counts']}\n")
          sys.exit(3 if not report['complete'] else 2 if report['has_findings'] else 0)
          PYTHON
