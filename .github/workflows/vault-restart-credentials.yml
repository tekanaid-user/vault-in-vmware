# Separate deliberate Workstream 1 credential issuance, never part of drift.
# Manual main-only run gated by VAULT_AUTOMATION_ENABLED=true; ENV-credentials
# Environment must have the agreed reviewers. Uses credential_role over OIDC.
# Input expected_version is the current delivery KV version; 0 for first write.
# Requires existing restart AppRole and restricted KV v2 delivery mount/path.
# Checks version before minting; CAS protects delivery; failed writes attempt
# cleanup of only the newly generated SecretID. Old credentials remain valid.
# Outputs only the new delivery version; no credential logs, artifacts or state.
# Runner: trusted self-hosted/vault-demo; shared ENV concurrency avoids overlap
# with configuration deployment. Setup: Section 13 RUNBOOK.md/SCRIPT-REFERENCE.md.

name: Vault restart credential issuance
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, uat, prod]
        required: true
      expected_version:
        description: Current delivery KV version; 0 for first issuance
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: vault-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  issue:
    if: github.ref == 'refs/heads/main' && vars.VAULT_AUTOMATION_ENABLED == 'true'
    runs-on: [self-hosted, vault-demo]
    # Separate protected Environment/role prevents incidental issuance during deploy.
    environment: ${{ inputs.environment }}-credentials
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # Helper validates version, CAS-writes in Vault and prints only version information.
      - name: Deliver credentials directly into Vault
        env:
          TARGET_ENV: ${{ inputs.environment }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python3 13-Vault-Configuration-Promotion/scripts/restart-credentials.py --env "$TARGET_ENV" --expected-version "$EXPECTED_VERSION"
