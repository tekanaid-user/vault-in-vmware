# Disposable demonstration: real GitHub OIDC against synthetic TLS Vaults only.
# Manual main-only run in vault-pilot; independent of live automation switches.
# Runner: hosted Ubuntu or one ephemeral self-hosted/vault-pilot container.
# Installs pinned Vault/Terraform with published checksum verification, then
# oidc-pilot.py starts three loopback dev servers and synthetic configuration.
# The pilot is bound to this demonstration repo's identity; copying the workflow
# does not configure existing Vault trust. Root tokens are fixture bootstrap only.
# Verifies rejected trust, denied value reads, plan/apply and introduced drift.
# Output: values-free pilot-report.json artifact, seven days. Temporary processes,
# TLS files, tokens and local state are cleaned by the script's finally blocks.
# Existing-environment onboarding uses vault-drift-onboarding.yml instead.
# Reproduce/limits: Section 13 OIDC-PILOT.md and SCRIPT-REFERENCE.md.

name: Vault development OIDC pilot
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [hosted, isolated]
        default: hosted
        description: Hosted Ubuntu or explicitly registered ephemeral pilot container
permissions:
  contents: read
concurrency:
  group: vault-development-oidc-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner == 'isolated' && fromJSON('["self-hosted", "vault-pilot"]') || 'ubuntu-latest' }}
    environment: vault-pilot
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # Published checksum match is required before executable installation.
      - name: Install pinned Vault and Terraform from official releases
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_DIR=$(mktemp -d)
          cd "$INSTALL_DIR"
          for SPEC in vault:2.1.0 terraform:1.16.1; do
            TOOL=${SPEC%%:*}
            VERSION=${SPEC##*:}
            ARCHIVE="${TOOL}_${VERSION}_linux_amd64.zip"
            curl --fail --silent --show-error --location --output "$ARCHIVE" "https://releases.hashicorp.com/$TOOL/$VERSION/$ARCHIVE"
            curl --fail --silent --show-error --location --output sums "https://releases.hashicorp.com/$TOOL/$VERSION/${TOOL}_${VERSION}_SHA256SUMS"
            awk -v file="$ARCHIVE" '$2 == file {print}' sums > selected-sum
            test -s selected-sum
            sha256sum --check selected-sum
            unzip -q -o "$ARCHIVE" "$TOOL"
            chmod +x "$TOOL"
          done
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
      # The helper owns fixture bootstrap, negative checks, redaction and cleanup.
      - name: Create isolated TLS Vaults and verify real OIDC
        run: |
          umask 077
          python3 13-Vault-Configuration-Promotion/scripts/oidc-pilot.py --output pilot-report.json
          echo 'Real GitHub OIDC tested against disposable TLS Vault dev servers. Review artifact for baseline and introduced drift.' >> "$GITHUB_STEP_SUMMARY"
      # Upload safe evidence only; temporary TLS keys/server logs/state are not artifacts.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-development-oidc-pilot
          path: pilot-report.json
          retention-days: 7
